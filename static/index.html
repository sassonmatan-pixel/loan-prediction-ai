<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מקרא פרדיקשיין | חיזוי הלוואות</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-mark" aria-hidden="true">✦</div>
          <div><p class="eyebrow">Loan intelligence</p><h1>מקרא פרדיקשיין</h1></div>
        </div>
        <nav class="nav-menu" aria-label="ניווט ראשי">
          <button class="nav-item active" data-target="dashboard"><span class="nav-icon">◈</span><span>מקרא המודל</span></button>
          <button class="nav-item" data-target="predictor"><span class="nav-icon">✦</span><span>חיזוי הלוואה</span></button>
        </nav>
        <div class="sidebar-note"><span class="note-icon">🛡️</span> המערכת נעזרת במודל למידת מכונה כדי להעריך את סיכויי אישור ההלוואה.</div>
      </aside>
      <main class="main-panel">
        <header class="topbar">
          <div><p class="eyebrow muted">תמונת מצב</p><h2>מקרא פרדיקשיין</h2></div>
          <div class="status-pill success" id="api-status">● מערכת פעילה</div>
        </header>
        <section id="dashboard" class="view active">
          <div class="section-intro"><div class="section-intro-icon">✦</div><div><h3>מקרא המודל</h3><p>פרטי המודל והגורמים המשמשים לחיזוי אישור ההלוואה.</p></div></div>
          <div class="stats-grid" id="stats-grid"></div>
          <div class="panel feature-panel"><div class="panel-header"><h3>גורמים בחיזוי ההלוואה</h3></div><div id="features-list" class="feature-list"></div></div>
        </section>
        <section id="predictor" class="view">
          <div class="panel form-panel">
            <div class="panel-header"><div><h3>חיזוי הלוואה</h3><p class="panel-subtitle">הזינו את פרטי הבקשה לקבלת הערכת אישור.</p></div><button class="secondary-btn" id="reset-form">↻ ניקוי הטופס</button></div>
            <form id="prediction-form" novalidate>
              <div class="form-grid">
                <div class="field-group"><label for="person_income"><span>₪</span> הכנסה שנתית</label><input id="person_income" name="person_income" type="number" step="0.01" min="1" placeholder="לדוגמה: 85000" /></div>
                <div class="field-group"><label for="person_emp_exp"><span>◷</span> שנות ניסיון</label><input id="person_emp_exp" name="person_emp_exp" type="number" min="0" placeholder="לדוגמה: 5" /></div>
                <div class="field-group"><label for="loan_amnt"><span>▣</span> סכום ההלוואה</label><input id="loan_amnt" name="loan_amnt" type="number" step="0.01" min="1" placeholder="לדוגמה: 35000" /></div>
                <div class="field-group"><label for="loan_int_rate"><span>%</span> שיעור הריבית</label><input id="loan_int_rate" name="loan_int_rate" type="number" step="0.01" min="0" placeholder="לדוגמה: 12.5" /></div>
                <div class="field-group"><label for="loan_percent_income"><span>◔</span> יחס ההחזר להכנסה</label><input id="loan_percent_income" name="loan_percent_income" type="number" step="0.01" min="0" placeholder="לדוגמה: 0.35" /></div>
                <div class="field-group"><label for="credit_score"><span>★</span> ציון אשראי</label><input id="credit_score" name="credit_score" type="number" min="300" max="850" placeholder="לדוגמה: 620" /></div>
                <div class="field-group full-width"><label for="previous_loan_defaults_on_file"><span>!</span> פיגור בהלוואה קודמת</label><select id="previous_loan_defaults_on_file" name="previous_loan_defaults_on_file"><option value="">בחרו אפשרות</option><option value="No">לא</option><option value="Yes">כן</option></select></div>
              </div>
              <div class="form-actions"><button type="submit" class="primary-btn" id="submit-btn"><span class="btn-label">✦ הפעלת חיזוי הלוואה</span><span class="spinner hidden" aria-hidden="true"></span></button></div>
            </form>
          </div>
          <div id="result-card" class="result-card hidden" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
